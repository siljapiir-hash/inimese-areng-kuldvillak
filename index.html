<!doctype html><html lang="et"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kuldvillak – Inimese areng</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#152b55;background:#f3f7fd}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1150px;margin:auto;padding:22px}h1{margin:0 0 8px;font-size:clamp(26px,4vw,42px)}.intro{margin:0 0 18px;color:#455574}.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:16px 0}.teams{display:flex;gap:10px;flex-wrap:wrap}.team{background:#fff;border:2px solid #d5e2f5;border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:700}.team.active{border-color:#2365c5;background:#e9f1ff}.team span{display:block;font-size:24px}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.category{display:flex;align-items:center;justify-content:center;text-align:center;min-height:74px;background:#173f86;color:white;font-weight:800;border-radius:10px;padding:8px;font-size:clamp(11px,1.8vw,18px)}.tile{min-height:92px;border:0;border-radius:10px;background:#2566c3;color:#fff;font-size:clamp(20px,3vw,32px);font-weight:800;cursor:pointer}.tile:hover:not(:disabled),.tile:focus-visible{background:#134f9d;outline:3px solid #ffcc56;outline-offset:2px}.tile:disabled{background:#d6dfed;color:#64748b;cursor:default}.muted{color:#52627e}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:12px 17px;font-size:16px;font-weight:700;cursor:pointer;background:#2365c5;color:#fff}.btn.alt{background:#e5edf9;color:#173f86}.btn.good{background:#14784b}.btn.bad{background:#a53b48}.btn:focus-visible{outline:3px solid #ffbf38;outline-offset:3px}dialog{width:min(680px,calc(100vw - 24px));border:0;border-radius:18px;padding:24px;box-shadow:0 18px 70px #1d355777}dialog::backdrop{background:#10274caa}.qmeta{font-size:14px;font-weight:700;color:#2862ad}.question{font-size:clamp(22px,3vw,30px);line-height:1.35;margin:18px 0}.answer{background:#eaf5ed;border-left:5px solid #18845b;padding:15px;border-radius:8px;font-size:20px;margin-bottom:20px}.footer{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:18px;flex-wrap:wrap}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:650px){.wrap{padding:12px}.board{gap:4px}.category{min-height:70px;padding:3px}.tile{min-height:65px}.team{padding:8px 12px}dialog{padding:18px}}</style></head><body><main class="wrap"><h1>🏆 Kuldvillak: Inimese areng</h1><p class="intro">6. klassi lihtsustatud õpe · 5 teemat · 25 küsimust. Vali võistkond ja vajuta punktisummale.</p><div class="toolbar"><div class="teams"><button class="team active" id="team1" onclick="selectTeam(0)" aria-pressed="true">Võistkond 1 <span id="score1">0 p</span></button><button class="team" id="team2" onclick="selectTeam(1)" aria-pressed="false">Võistkond 2 <span id="score2">0 p</span></button></div><button class="btn alt" onclick="resetGame()">↻ Alusta uuesti</button></div><section class="board" id="board" aria-label="Kuldvillaku mängulaud"></section><div class="footer"><p class="muted" id="progress" aria-live="polite">Vastatud: 0 / 25</p><p class="muted">Õpetaja hindab vastust. Sarnase tähendusega vastused sobivad.</p></div></main><dialog id="modal" aria-labelledby="question"><div class="qmeta" id="qmeta"></div><h2 class="question" id="question"></h2><div id="answer" class="answer" hidden></div><div class="actions" id="questionActions"><button class="btn" onclick="showAnswer()">Näita vastust</button><button class="btn alt" onclick="closeQuestion()">Tagasi mängulauale</button></div><div class="actions" id="scoreActions" hidden><button class="btn good" onclick="mark(true)">✓ Õige vastus</button><button class="btn bad" onclick="mark(false)">✕ Vale vastus</button><button class="btn alt" onclick="closeQuestion()">Tagasi</button></div></dialog><script>
const cats=['Elukaar','Murdeiga','Kehalised muutused','Hügieen','Tunded ja suhtlemine'];
const data=[
[['Mis on inimese elu esimene etapp?','Imikuiga.'],['Kes tuleb elukaares pärast last?','Nooruk.'],['Järjesta: eakas, laps, imik, täiskasvanu, nooruk.','Imik → laps → nooruk → täiskasvanu → eakas.'],['Nimeta kaks oskust, mida laps kasvades õpib.','Näiteks rääkimine, kõndimine, lugemine või kirjutamine.'],['Kas inimene areneb ainult lapsepõlves? Selgita.','Ei. Inimene õpib ja areneb kogu elu.']],
[['Mis on murdeiga?','Aeg, mil lapse keha ja tunded muutuvad.'],['Kas murdeiga algab kõigil samal ajal?','Ei. Inimesed arenevad erinevas tempos.'],['Nimeta üks muutus, mis võib murdeeas toimuda.','Näiteks kiire kasvamine, higistamine või kehakarvade teke.'],['Mida teha, kui oled oma keha muutuste pärast mures?','Küsi nõu usaldusväärselt täiskasvanult või tervishoiutöötajalt.'],['Sõber areneb sinust kiiremini. Kuidas käitud?','Austan teda ega võrdle ega pilka meie kehasid.']],
[['Mis võib murdeeas juhtuda häälega?','Hääl võib muutuda madalamaks.'],['Mis võib juhtuda naha ja higistamisega?','Nahk võib muutuda rasusemaks ja higistamine suureneda.'],['Mis on menstruatsioon?','Loomulik kehaline muutus, mille korral väljub tupest verd.'],['Mis on märg unenägu?','Une ajal võib peenisest väljuda seemnevedelikku. See on loomulik.'],['Kas kõigil inimestel toimuvad täpselt samad kehalised muutused?','Ei. Muutused ja nende algusaeg on erinevad.']],
[['Miks on vaja käsi pesta?','Et eemaldada mustust ja vähendada haiguste levikut.'],['Mida kasutad hammaste puhastamiseks?','Hambaharja ja hambapastat.'],['Miks tuleb murdeeas keha regulaarselt pesta?','Higi ja mustuse eemaldamiseks ning naha puhtana hoidmiseks.'],['Mida teed pärast kehalise kasvatuse tundi?','Vajaduse korral pesen keha ja vahetan higised riided.'],['Mida teha, kui nahahooldusvahend ärritab nahka?','Lõpetan selle kasutamise ja küsin täiskasvanult nõu.']],
[['Kuidas näitad, et kuulad sõpra?','Lasen tal rääkida ega sega vahele.'],['Mida võid teha, kui oled vihane?','Rahunen, hingan sügavalt ja räägin oma tunnetest.'],['Mida teed, kui keegi ütleb kallistusele „ei“?','Austan tema soovi.'],['Kuidas saad sõbrale viisakalt öelda, et ta sulle meeldib?','Näiteks: „Mulle meeldib sinuga aega veeta.“'],['Sõber teeb teise keha üle nalja. Mida teed?','Ütlen, et see pole sobiv, toetan kaaslast ja vajaduse korral küsin abi.']]
];
let scores=[0,0],activeTeam=0,used=new Set(),current=null;const board=document.getElementById('board'),modal=document.getElementById('modal');
function draw(){board.innerHTML='';cats.forEach(x=>{let el=document.createElement('div');el.className='category';el.textContent=x;board.append(el)});for(let r=0;r<5;r++)for(let c=0;c<5;c++){const id=c+'-'+r,b=document.createElement('button');b.className='tile';b.textContent=used.has(id)?'✓':(r+1)*100;b.disabled=used.has(id);b.setAttribute('aria-label',cats[c]+', '+(r+1)*100+' punkti'+(used.has(id)?', vastatud':''));b.onclick=()=>openQuestion(c,r);board.append(b)}document.getElementById('progress').textContent='Vastatud: '+used.size+' / 25'+(used.size===25?' · Mäng läbi!':'');scores.forEach((s,i)=>document.getElementById('score'+(i+1)).textContent=s+' p')}
function selectTeam(i){activeTeam=i;[0,1].forEach(j=>{let b=document.getElementById('team'+(j+1));b.classList.toggle('active',i===j);b.setAttribute('aria-pressed',String(i===j))})}
function openQuestion(c,r){current={c,r};document.getElementById('qmeta').textContent=cats[c]+' · '+(r+1)*100+' punkti · Vastab võistkond '+(activeTeam+1);document.getElementById('question').textContent=data[c][r][0];document.getElementById('answer').textContent=data[c][r][1];document.getElementById('answer').hidden=true;document.getElementById('questionActions').hidden=false;document.getElementById('scoreActions').hidden=true;modal.showModal()}
function showAnswer(){document.getElementById('answer').hidden=false;document.getElementById('questionActions').hidden=true;document.getElementById('scoreActions').hidden=false}
function mark(correct){if(!current)return;const {c,r}=current,id=c+'-'+r;if(used.has(id))return;if(correct)scores[activeTeam]+=(r+1)*100;used.add(id);closeQuestion();draw()}
function closeQuestion(){modal.close();current=null}
function resetGame(){if(used.size&&!confirm('Kas soovid mängu uuesti alustada? Punktid kustutatakse.'))return;scores=[0,0];used.clear();current=null;selectTeam(0);draw()}
modal.addEventListener('cancel',()=>{current=null});draw();
</script></body></html>
