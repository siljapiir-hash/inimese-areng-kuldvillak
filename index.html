<!doctype html>
<html lang="et"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kuldvillak – Inimese areng</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#172744;background:#edf3fc}*{box-sizing:border-box}body{margin:0;padding:18px}.wrap{max-width:1100px;margin:auto}h1{text-align:center;color:#143b83;margin:12px 0 4px}.intro{text-align:center;margin:0 0 16px;color:#405472}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:15px}.pill{background:white;padding:10px 15px;border-radius:12px;font-weight:700}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.head{background:#173f8a;color:white;min-height:76px;display:flex;align-items:center;justify-content:center;text-align:center;padding:7px;font-size:clamp(11px,1.8vw,17px);font-weight:750;border-radius:10px}.tile{border:0;background:#2464c0;color:white;border-radius:10px;min-height:79px;font-size:clamp(20px,3vw,31px);font-weight:800;cursor:pointer}.tile:hover,.tile:focus-visible{background:#174d9e;outline:3px solid #f4b942}.tile.done{background:#d4dce9;color:#52647d;cursor:default}.panel{background:white;border-radius:18px;padding:22px;margin-top:17px;box-shadow:0 4px 20px #10274a18}.hide{display:none!important}.meta{color:#49618a;font-weight:700}.question{font-size:clamp(20px,3vw,29px);font-weight:750;margin:12px 0 20px}.choices{display:grid;gap:10px}.choice{border:2px solid #bed0eb;background:#f6f9ff;text-align:left;border-radius:12px;padding:16px;font-size:18px;cursor:pointer;color:#142849}.choice:hover:not(:disabled){border-color:#2864ba;background:#e8f1ff}.choice:disabled{cursor:default}.choice.correct{background:#d8f5df;border-color:#25874a}.choice.wrong{background:#ffe3e3;border-color:#c94242}.feedback{margin-top:15px;padding:14px;border-radius:12px;background:#eef4fd;font-size:18px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.action{border:0;border-radius:10px;background:#194d9b;color:white;padding:13px 20px;font-size:16px;font-weight:700;cursor:pointer}.action.secondary{background:#e3eaf5;color:#193b70}.foot{text-align:center;color:#506482;margin-top:16px;font-size:14px}@media(max-width:600px){body{padding:9px}.board{gap:4px}.head{min-height:70px;padding:3px}.tile{min-height:60px}.panel{padding:16px}.choice{font-size:16px;padding:13px}}
</style></head><body><main class="wrap"><h1>🌟 Kuldvillak: Inimese areng</h1><p class="intro">6. klass · Vali punktisumma ja seejärel üks kolmest vastusest.</p><div class="toolbar"><div class="pill" id="score">Punktid: 0</div><div class="pill" id="progress">Vastatud: 0 / 25</div><button class="action secondary" id="restart">Alusta uuesti</button></div><div class="board" id="board"></div><section class="panel hide" id="panel" aria-live="polite"><div class="meta" id="meta"></div><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="feedback hide" id="feedback"></div><div class="actions"><button class="action hide" id="back">Tagasi mängulauale</button></div></section><p class="foot">Iga õige vastus annab küsimuse punktid. Vale vastuse eest punkte ei lisandu. Iga küsimust saab vastata ühe korra.</p></main><script>
const categories=['Elukaar','Murdeiga','Kehalised muutused','Hügieen','Tunded ja suhtlemine'];
// Each question: question, three choices, index of correct choice, explanatory feedback.
const data=[
[
['Mis on inimese elu esimene etapp?',['Imikuiga','Täiskasvanuiga','Noorukiiga'],0,'Inimese elukaar algab imikueast.'],
['Kes tuleb elukaares pärast last?',['Eakas','Nooruk','Imik'],1,'Pärast lapseiga tuleb noorukiiga.'],
['Milline on õige elukaare järjekord?',['Laps → imik → eakas → nooruk → täiskasvanu','Imik → nooruk → laps → täiskasvanu → eakas','Imik → laps → nooruk → täiskasvanu → eakas'],2,'Inimene kasvab imikust lapseks, noorukiks, täiskasvanuks ja eakaks.'],
['Millist oskust võib laps kasvades õppida?',['Lugemist','Lendamist','Nähtamatuks muutumist'],0,'Kasvades õpib laps näiteks kõndima, rääkima ja lugema.'],
['Kas inimene areneb ainult lapsepõlves?',['Jah, pärast seda ei õpi midagi','Ei, inimene õpib kogu elu','Ainult siis, kui ta koolis käib'],1,'Õppimine ja arenemine jätkuvad kogu elu.']
],
[
['Mis on murdeiga?',['Aeg, mil keha ja tunded muutuvad','Aeg, mil inimene jääb väiksemaks','Aeg, mil õppimine lõpeb'],0,'Murdeeas muutuvad nii keha kui ka tunded.'],
['Kas murdeiga algab kõigil samal ajal?',['Jah, täpselt samal päeval','Ainult tüdrukutel','Ei, igaüks areneb omas tempos'],2,'Inimesed kasvavad ja arenevad erinevas tempos.'],
['Milline muutus võib murdeeas toimuda?',['Higistamine võib suureneda','Inimene lõpetab kasvamise kohe','Kõik hambad kaovad'],0,'Murdeeas võib suureneda higistamine ning tekkida kehakarvu.'],
['Kellelt saab murdeea kohta nõu küsida?',['Ainult võõrastelt internetis','Usaldusväärselt täiskasvanult','Mitte kelleltki'],1,'Abi võib küsida näiteks vanemalt, õpetajalt või tervishoiutöötajalt.'],
['Sõber kasvab sinust kiiremini. Mida teed?',['Naeran tema üle','Võrdlen pidevalt meie kehasid','Austan teda ega pilka'],2,'Erinev arengutempo on loomulik.']
],
[
['Mis võib murdeeas häälega juhtuda?',['Hääl võib muutuda madalamaks','Hääl kaob igaveseks','Hääl muutub kõigil ühesuguseks'],0,'Eriti poistel võib hääl murdeeas madalamaks muutuda.'],
['Mis võib murdeeas nahaga juhtuda?',['Nahk ei muutu kunagi','Nahk võib muutuda rasusemaks','Nahk muutub alati siniseks'],1,'Murdeeas võivad tekkida ka vistrikud.'],
['Mis on menstruatsioon?',['Haigus, mida kõik põevad','Juuste kasvamine','Loomulik muutus, mil tupest väljub verd'],2,'Menstruatsioon on loomulik osa paljude tüdrukute ja naiste keha toimimisest.'],
['Mis on märg unenägu?',['Une ajal võib väljuda seemnevedelikku','Inimene higistab vihma käes','Öösel tuleb alati duši all käia'],0,'Märg unenägu on murdeeas võimalik loomulik kehaline nähtus.'],
['Kas kõigil on täpselt samad kehalised muutused?',['Jah, kõigil täpselt samal ajal','Ei, kehad ja muutused on erinevad','Ainult pikkus võib erineda'],1,'Iga inimese keha on erinev ja areneb omas tempos.']
],
[
['Miks tuleb käsi pesta?',['Et käed muutuksid suuremaks','Et riided kuivaksid','Et eemaldada mustust ja haigustekitajaid'],2,'Kätepesu aitab hoida tervist.'],
['Millega puhastad hambaid?',['Hambaharja ja hambapastaga','Ainult veega kord kuus','Juukseharjaga'],0,'Hambaid tuleb regulaarselt pesta hambaharja ja -pastaga.'],
['Miks tuleb murdeeas keha regulaarselt pesta?',['Et keha ei kasvaks','Et eemaldada higi ja mustust','Et juuksed muutuksid pikemaks'],1,'Pesemine aitab hoida naha puhtana.'],
['Mida teed pärast higistamist?',['Panen mustad riided tagasi','Ei tee kunagi midagi','Vajaduse korral pesen ja vahetan riided'],2,'Puhtad riided ja pesemine aitavad hoida head hügieeni.'],
['Mida teha, kui kreem ärritab nahka?',['Lõpetan kasutamise ja küsin nõu','Panen seda veel rohkem','Ei räägi sellest kellelegi'],0,'Ärritava vahendi kasutamine tuleb lõpetada ja vajaduse korral nõu küsida.']
],
[
['Kuidas näitad, et kuulad sõpra?',['Räägin kogu aeg vahele','Lasen tal rääkida','Lähen kohe minema'],1,'Hea kuulaja laseb teisel oma mõtte lõpuni öelda.'],
['Mida teha, kui oled vihane?',['Lükkan kedagi','Lõhun asju','Rahunen ja räägin oma tunnetest'],2,'Sügav hingamine ja rahulik rääkimine aitavad.'],
['Keegi ütleb kallistusele „ei“. Mida teed?',['Austan tema soovi','Kallistan ikka','Naeran tema üle'],0,'Igal inimesel on õigus otsustada oma keha üle.'],
['Kuidas öelda viisakalt, et keegi sulle meeldib?',['„Sa pead minuga sõber olema!“','„Mulle meeldib sinuga aega veeta.“','„Ma ei kuula sinu vastust.“'],1,'Oma tunnetest saab rääkida sõbralikult ja teise soove austades.'],
['Sõber pilkab kellegi keha. Mida teed?',['Naeran kaasa','Teen samuti nalja','Ütlen, et see pole sobiv, ja toetan kaaslast'],2,'Teiste keha ei ole sobiv pilgata. Vajaduse korral küsi täiskasvanult abi.']
]
];
let completed={},score=0,active=null;const $=id=>document.getElementById(id);function render(){const board=$('board');board.innerHTML='';categories.forEach(cat=>{let h=document.createElement('div');h.className='head';h.textContent=cat;board.append(h)});for(let r=0;r<5;r++)for(let c=0;c<5;c++){let key=c+'-'+r,b=document.createElement('button');b.className='tile'+(completed[key]?' done':'');b.textContent=completed[key]?'✓':(r+1)*100;b.disabled=!!completed[key];b.setAttribute('aria-label',categories[c]+', '+(r+1)*100+' punkti');b.onclick=()=>openQuestion(c,r);board.append(b)}$('score').textContent='Punktid: '+score;$('progress').textContent='Vastatud: '+Object.keys(completed).length+' / 25'}function openQuestion(c,r){active={c,r};const q=data[c][r];$('panel').classList.remove('hide');$('meta').textContent=categories[c]+' · '+(r+1)*100+' punkti';$('question').textContent=q[0];$('feedback').classList.add('hide');$('back').classList.add('hide');$('choices').innerHTML='';q[1].forEach((answer,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+i)+'. '+answer;b.onclick=()=>answerQuestion(i);$('choices').append(b)});$('panel').scrollIntoView({behavior:'smooth',block:'start'})}function answerQuestion(i){if(!active)return;const {c,r}=active,key=c+'-'+r;if(completed[key])return;const q=data[c][r],correct=i===q[2];completed[key]=true;if(correct)score+=(r+1)*100;[...$('choices').children].forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('feedback').textContent=(correct?'✅ Õige vastus! +'+(r+1)*100+' punkti. ':'❌ Seekord vale vastus. ')+q[3];$('feedback').classList.remove('hide');$('back').classList.remove('hide');render()}$('back').onclick=()=>{$('panel').classList.add('hide');active=null;window.scrollTo({top:0,behavior:'smooth'});if(Object.keys(completed).length===25)setTimeout(()=>alert('Mäng läbi! Kogusid '+score+' punkti 7500 võimalikust.'),250)};$('restart').onclick=()=>{if(confirm('Kas soovid kõik punktid ja vastused nullida?')){completed={};score=0;active=null;$('panel').classList.add('hide');render()}};render();
</script></body></html>
